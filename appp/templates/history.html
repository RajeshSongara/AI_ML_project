<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Prediction History</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            font-family: Arial, sans-serif;
        }

        .container {
            margin-top: 50px;
        }

        .card {
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            padding: 20px;
            background: white;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
            color: #333;
        }

        table {
            border-radius: 10px;
            overflow: hidden;
        }

        thead {
            background: #4e73df;
            color: white;
        }

        tbody tr:hover {
            background: #f1f3f9;
            transition: 0.3s;
        }

        .badge-custom {
            background: #28a745;
            padding: 5px 10px;
            border-radius: 10px;
            color: white;
        }
    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <h2>📊 Prediction History</h2>

        <div class="table-responsive">
            <table class="table table-striped table-hover text-center">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Hours</th>
                        <th>Attendance</th>
                        <th>Predicted Marks</th>
                    </tr>
                </thead>

                <tbody>
                    {% for row in data %}
                    <tr>
                        <td><span class="badge bg-secondary">{{ row[0] }}</span></td>
                        <td>{{ row[1] }}</td>
                        <td>{{ row[2] }}%</td>
                        <td>
                            <span class="badge-custom">
                                {{ row[3] }}
                            </span>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>

            </table>
        </div>

    </div>

</div>

</body>
</html>
