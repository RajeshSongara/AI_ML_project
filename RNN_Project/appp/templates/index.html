<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>AI Student Predictor</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(-45deg,#0f2027,#203a43,#2c5364,#1c92d2);
    background-size: 400% 400%;
    animation: bg 12s ease infinite;
}

@keyframes bg {
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

/* floating particles */
.particle {
    position: absolute;
    width: 6px;
    height: 6px;
    background: rgba(255,255,255,0.6);
    border-radius: 50%;
    animation: float 15s linear infinite;
}

@keyframes float {
    0%{transform: translateY(0)}
    100%{transform: translateY(-1000px)}
}

/* card */
.card {
    width: 420px;
    padding: 30px;
    border-radius: 25px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(20px);
    box-shadow: 0 0 25px rgba(0,0,0,0.3);
    color: white;
    text-align: center;
    animation: pop 0.8s ease;
    border: 1px solid rgba(255,255,255,0.2);
}

@keyframes pop {
    from {transform: scale(0.7); opacity: 0;}
    to {transform: scale(1); opacity: 1;}
}

.icon {
    font-size: 50px;
    animation: bounce 2s infinite;
}

@keyframes bounce {
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-10px)}
}

h2 {
    margin: 10px 0 20px;
    font-weight: 600;
}

/* inputs */
.form-control {
    border-radius: 12px;
    padding: 12px;
    border: none;
    margin-bottom: 12px;
    transition: 0.3s;
}

.form-control:focus {
    transform: scale(1.03);
    box-shadow: 0 0 15px rgba(255,255,255,0.4);
}

/* button */
.btn-custom {
    width: 100%;
    border-radius: 12px;
    padding: 12px;
    border: none;
    font-weight: bold;
    color: white;
    background: linear-gradient(90deg,#ff512f,#dd2476);
    transition: 0.3s;
}

.btn-custom:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px rgba(255,255,255,0.4);
}

/* loading */
.loader {
    display: none;
    margin-top: 10px;
}

</style>
</head>

<body>

<!-- particles -->
<script>
for(let i=0;i<30;i++){
    document.write(`<div class="particle" style="left:${Math.random()*100}%;animation-duration:${5+Math.random()*10}s"></div>`);
}
</script>

<div class="card">

    <div class="icon">🎓</div>
    <h2>AI Student Predictor</h2>
    <p style="font-size:13px;opacity:0.8;">Enter details to get AI prediction</p>

    <form action="/predict" method="post" onsubmit="showLoader()">

        <input type="number" name="hours" class="form-control" placeholder="Study Hours" required>

        <input type="number" name="attendance" class="form-control" placeholder="Attendance %" required>

        <button class="btn btn-custom" type="submit">🚀 Predict Marks</button>

        <div class="loader" id="loader">
            ⏳ AI is analyzing...
        </div>

    </form>

</div>

<script>
function showLoader(){
    document.getElementById("loader").style.display="block";
}
</script>

</body>
</html>
